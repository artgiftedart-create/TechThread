<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TechThread Pro | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>
    <style>
        :root { 
            --bg: #1a1a1a; 
            --text: #e2e8f0; 
            --shadow-light: #252525; 
            --shadow-dark: #0f0f0f; 
            --accent: #8b5cf6; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            display: flex; 
            height: 100vh; 
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: var(--bg);
            padding: 25px 15px;
            border-right: 1px solid var(--shadow-light);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar h2 { font-size: 1.2rem; margin-bottom: 30px; text-align: center; color: var(--accent); }
        
        .chat-item {
            padding: 15px;
            margin-bottom: 15px;
            background: var(--bg);
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .chat-item:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 80%;
            padding: 18px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
            position: relative;
        }

        .user { 
            background: var(--bg); 
            align-self: flex-end; 
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            border-bottom-right-radius: 4px;
        }

        .bot { 
            background: var(--bg); 
            align-self: flex-start; 
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            border-bottom-left-radius: 4px;
            white-space: pre-wrap;
        }

        .copy-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: none;
            border: none;
            color: var(--accent);
            font-size: 0.7rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .input-area {
            display: flex;
            padding: 20px;
            gap: 15px;
        }

        .neu-input {
            flex: 1;
            padding: 18px;
            border-radius: 14px;
            background: var(--bg);
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
            border: none;
            color: var(--text);
            outline: none;
            font-family: inherit;
        }

        .neu-button {
            padding: 0 25px;
            border-radius: 14px;
            background: var(--bg);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            border: none;
            color: var(--accent);
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .neu-button:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        .social-footer { text-align: center; padding-top: 20px; border-top: 1px solid var(--shadow-light); }
        .x-icon { width: 24px; height: 24px; fill: var(--text); }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <h2>TechThread</h2>
            <div class="chat-item">New Transmutation</div>
            <div class="chat-item">Signal History</div>
        </div>
        
        <div class="social-footer">
            <a href="https://x.com/Joe_Wills1" target="_blank" class="x-link">
                <svg class="x-icon" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
            </a>
        </div>
    </div>

    <div class="main">
        <div class="chat-box" id="chatBox">
            <div class="message bot">Welcome, Strategist. Paste a video link or transcript below to begin the transmutation.</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" class="neu-input" placeholder="Paste link or signal data..." onkeypress="handleKey(event)" />
            <button class="neu-button" onclick="sendMessage()">TRANSMUTE</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // --- AUTH & CONFIGURATION ---
        const SUPABASE_URL = 'https://jlcotzxaqmafljaezses.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nldmcqvxDob8TuZt06FSLQ_WiSqTsLY';
        const GEMINI_KEY = 'AIzaSyA92egwE7xtnPWjakPkRYSLmHJtt8KxsaQ';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const genAI = new GoogleGenerativeAI(GEMINI_KEY);

        // --- CORE FUNCTIONS ---
        
        window.handleKey = (e) => {
            if (e.key === 'Enter') sendMessage();
        };

        window.sendMessage = async () => {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';

            const loadingId = addMessage("⚡ ANALYZING SIGNAL...", 'bot');

            try {
                // Using 1.5 Flash for speed and high context window
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                
                const prompt = `
                    Act as a World-Class Digital Content Strategist. 
                    Source Material: ${text}
                    
                    Task:
                    1. Analyze the core value in this link/text.
                    2. Create a high-engagement X (Twitter) thread.
                    3. MUST be at least 8 tweets long.
                    4. Tweet 1: Scroll-stopping hook.
                    5. Tweets 2-7: Deep-dive value points.
                    6. Tweet 8: Conclusion and CTA to follow @Joe_Wills1.
                    
                    Format each tweet clearly as "Tweet 1:", "Tweet 2:", etc.
                `;

                const result = await model.generateContent(prompt);
                const response = await result.response;
                updateMessage(loadingId, response.text());
            } catch (err) {
                updateMessage(loadingId, "Error: " + err.message);
                console.error(err);
            }
        };

        // --- AUTHENTICATION REPAIR ---
        // Call this function when you want to sign someone up/in
        async function signUpUser(email, password) {
            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
            });
            if (error) console.error("Auth Error:", error.message);
            else console.log("Sign-up successful! Check your email for confirmation.");
        }

        // --- UI HELPERS ---
        function addMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const msg = document.createElement('div');
            const id = 'msg-' + Date.now();
            msg.id = id;
            msg.classList.add('message', sender);
            
            if (sender === 'bot') {
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.innerText = 'Copy';
                btn.onclick = () => {
                    navigator.clipboard.writeText(msg.innerText.replace('Copy', ''));
                    btn.innerText = 'Copied!';
                    setTimeout(() => btn.innerText = 'Copy', 2000);
                };
                msg.appendChild(btn);
            }

            const textNode = document.createTextNode(text);
            msg.appendChild(textNode);
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function updateMessage(id, newText) {
            const msg = document.getElementById(id);
            if (msg) {
                // Preserve the copy button if it exists
                const btn = msg.querySelector('.copy-btn');
                msg.innerText = '';
                if (btn) msg.appendChild(btn);
                msg.appendChild(document.createTextNode(newText));
            }
            const chatBox = document.getElementById('chatBox');
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
